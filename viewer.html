<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Web - Visualizador</title>
</head>

<body>

    <h1>Visualizador</h1>

    <p>Esperando transmissão...</p>

    <video
        id="videoRemoto"
        autoplay
        playsinline>
    </video>


    <script type="module">

        // ========================================
        // FIREBASE
        // ========================================

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            onChildAdded,
            push,
            set
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


        const firebaseConfig = {

            apiKey: "AIzaSyDOxjJ26Epq0FNkFjzwHtmDXxlPHX96A34",
            authDomain: "camera-web-cea80.firebaseapp.com",

            databaseURL:
                "https://camera-web-cea80-default-rtdb.firebaseio.com",

            projectId: "camera-web-cea80",
            storageBucket: "camera-web-cea80.firebasestorage.app",
            messagingSenderId: "300751079533",
            appId: "1:300751079533:web:db8421292d4bb9b8691764"

        };


        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        console.log("Firebase conectado!");


        // ========================================
        // WEBRTC
        // ========================================

        const configuracaoWebRTC = {

            iceServers: [

                {
                    urls: "stun:stun.l.google.com:19302"
                }

            ]

        };


        const conexao =
            new RTCPeerConnection(configuracaoWebRTC);


        console.log("WebRTC criado!");


        // ========================================
        // VÍDEO REMOTO
        // ========================================

        const videoRemoto =
            document.getElementById("videoRemoto");


        // Quando receber a câmera do celular

        conexao.ontrack = function(evento) {

            console.log("Vídeo recebido!");

            videoRemoto.srcObject =
                evento.streams[0];

        };


        // ========================================
        // FIREBASE - SALA
        // ========================================

        const sala =
            ref(database, "sala");


        // ========================================
        // RECEBER OFERTA DA CÂMERA
        // ========================================

        onValue(
            ref(database, "sala/oferta"),
            async (snapshot) => {

                const oferta = snapshot.val();


                if (!oferta) {

                    console.log(
                        "Aguardando a câmera..."
                    );

                    return;

                }


                console.log(
                    "Oferta recebida!"
                );


                await conexao.setRemoteDescription(
                    new RTCSessionDescription(oferta)
                );


                // Criar resposta

                const resposta =
                    await conexao.createAnswer();


                await conexao.setLocalDescription(
                    resposta
                );


                // Enviar resposta para o Firebase

                await set(
                    ref(database, "sala/resposta"),
                    {
                        type: resposta.type,
                        sdp: resposta.sdp
                    }
                );


                console.log(
                    "Resposta enviada!"
                );

            }
        );


        // ========================================
        // RECEBER ICE CANDIDATES DA CÂMERA
        // ========================================

        onChildAdded(
            ref(database, "sala/cameraCandidates"),
            async (snapshot) => {

                const candidate =
                    snapshot.val();


                if (!candidate) {
                    return;
                }


                try {

                    await conexao.addIceCandidate(
                        new RTCIceCandidate(candidate)
                    );


                    console.log(
                        "Candidate da câmera recebido!"
                    );

                }

                catch (erro) {

                    console.error(
                        "Erro ao adicionar candidate:",
                        erro
                    );

                }

            }
        );


        // ========================================
        // ENVIAR ICE CANDIDATES DO VISUALIZADOR
        // ========================================

        conexao.onicecandidate =
            function(evento) {

                if (!evento.candidate) {
                    return;
                }


                push(
                    ref(
                        database,
                        "sala/viewerCandidates"
                    ),
                    evento.candidate.toJSON()
                );


                console.log(
                    "Candidate do visualizador enviado!"
                );

            };


    </script>

</body>

</html>
