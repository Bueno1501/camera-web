<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Web</title>
</head>

<body>

    <h1>Camera Web</h1>

 <p style="font-size: 32px">Te peguei</p>

    <video id="camera" autoplay playsinline></video>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

         const firebaseConfig = {
            apiKey: "AIzaSyDOxjJ26Epq0FNkFjzwHtmDXxlPHX96A34",
            authDomain: "camera-web-cea80.firebaseapp.com",
            databaseURL: "https://camera-web-cea80-default-rtdb.firebaseio.com",
            projectId: "camera-web-cea80",
            storageBucket: "camera-web-cea80.firebasestorage.app",
            messagingSenderId: "300751079533",
            appId: "1:300751079533:web:db8421292d4bb9b8691764"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        console.log("Firebase inicializado com sucesso!");

        const configuracaoWebRTC = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        const conexao = new window.RTCPeerConnection(configuracaoWebRTC);
        
        console.log("Conexão WebRTC criada com sucesso!");

        async function iniciarCamera() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                const video = document.getElementById("camera");

                stream.getTracks().forEach(track => conexao.addTrack(track, stream));

                console.log("Fluxo de mídia adicionado à conexão WebRTC com sucesso!");



            } catch (erro) {

                console.error("Erro ao acessar a câmera:", erro);

            }

        }

        iniciarCamera();

    </script>

</body>

</html>
